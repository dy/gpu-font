  <main>
    <section class="intro page-intro" aria-labelledby="catalogs-title">
      <h1 id="catalogs-title">Catalogs</h1>
      <div class="intro-copy">
        <p>Your own fonts, the fonts a search covers, and the sources left out.</p>
        <p id="sources-summary" class="intro-scope"></p>
      </div>
    </section>
    <section id="my-fonts" class="stacked" aria-labelledby="my-fonts-title">
      <h2 id="my-fonts-title">My fonts</h2>
      <div class="explanation-copy">
        <div class="my-fonts-actions">
          <button id="index-installed" class="action" hidden>Index installed fonts</button>
          <button id="index-folder" class="action">Choose a font folder</button>
          <button id="index-files" class="text-button">or font files</button>
          <button id="index-stop" class="text-button" hidden>Stop</button>
        </div>
        <input id="folder-input" type="file" webkitdirectory multiple hidden>
        <input id="files-input" type="file" accept=".ttf,.otf,.ttc,.otc,.woff,.woff2" multiple hidden>
        <p id="my-fonts-status" role="status" aria-live="polite"></p>
        <p id="my-fonts-stored" hidden><a id="my-fonts-search" href="./?catalog=my-fonts">Search my fonts</a><button id="my-fonts-remove" class="text-button">Remove</button></p>
      </div>
      <div class="table-scroll" :if="mine.length">
        <table class="sources-table my-fonts-table">
          <thead><tr><th scope="col">Family</th><th scope="col">Styles</th><th scope="col" class="number">Faces</th></tr></thead>
          <tbody><tr :each="font in mine"><th scope="row" :text="font.family"></th><td :text="font.styles"></td><td class="number" :text="count(font.faces)"></td></tr></tbody>
        </table>
      </div>
    </section>
    <section id="included" class="stacked" aria-labelledby="included-title">
      <h2 id="included-title">Included</h2>
      <div class="table-scroll" :scope="{ list: included, sort: { key: 'families', dir: -1 }, json: true }" :html="document.getElementById('source-table')"></div>
    </section>
    <section id="sources" class="stacked" aria-labelledby="sources-title">
      <h2 id="sources-title">Not included</h2>
      <div class="table-scroll" :scope="{ list: others, sort: { key: 'status', dir: 1 }, json: false }" :html="document.getElementById('source-table')"></div>
    </section>
    <template id="source-table">
    <table class="sources-table">
      <thead><tr>
        <th scope="col" :aria-sort="order(sort, 'name')"><button class="sort" :onclick="sort = next(sort, 'name')">Source</button></th>
        <th scope="col" :aria-sort="order(sort, 'terms')"><button class="sort" :onclick="sort = next(sort, 'terms')">Terms</button></th>
        <th scope="col" :aria-sort="order(sort, 'licence')"><button class="sort" :onclick="sort = next(sort, 'licence')">Licence</button></th>
        <th scope="col" :aria-sort="order(sort, 'status')"><button class="sort" :onclick="sort = next(sort, 'status')">Status</button></th>
        <th scope="col" class="number" :aria-sort="order(sort, 'families')"><button class="sort" :onclick="sort = next(sort, 'families')">Families</button></th>
        <th scope="col" class="number" :if="json">JSON</th>
      </tr></thead>
      <tbody>
        <tr :each="source in sorted(list, sort)" :id="source.id">
          <th scope="row"><a :href="source.url" target="_blank" rel="noopener" :text="source.name"></a><span class="detail" :if="source.members" :text="source.members"></span></th>
          <td>
            <span class="pill" :data-terms="source.terms.status" :text="TERMS[source.terms.status] ?? source.terms.status"></span>
            <details :if="source.terms.quote || source.terms.note"><summary :text="source.terms.quote ? 'Clause' : 'Note'"></summary><blockquote :if="source.terms.quote" :text="source.terms.quote"></blockquote><p :if="source.terms.note" :text="source.terms.note"></p><p class="checked"><a :if="source.terms.url" :href="source.terms.url" target="_blank" rel="noopener">Terms</a><span :text="source.terms.url ? `, read ${source.terms.checked}` : `Checked ${source.terms.checked}`"></span></p></details>
          </td>
          <td :text="source.licence ?? '–'"></td>
          <td><span class="status" :text="WORK[source.work.status] ?? source.work.status"></span><span class="held" :if="source.work.familiesHeldLocally" :text="`${count(source.work.familiesHeldLocally)} held locally, not shipped`"></span><span class="detail" :if="source.work.reason || source.work.route" :text="source.work.reason ?? source.work.route"></span></td>
          <td class="number" :text="familiesText(source)" :title="source.availableNote"></td>
          <td class="number" :if="json"><a :href="source.json.file" download :text="size(source.json.bytes)"></a></td>
        </tr>
      </tbody>
    </table>
    </template>
  </main>
